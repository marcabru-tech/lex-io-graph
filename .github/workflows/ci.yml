name: CI — Smoke test

# Roda em todo PR para main e em todo push para main.
# É a verificação que o ADR 005 pressupunha e não existia: barra dados
# inconsistentes, ImportError e página quebrada antes do deploy do
# Streamlit Cloud (que publica automaticamente o que chega em main).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04  # fixado: ubuntu-latest migra para Ubuntu 26 em 19/10/2026
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Smoke test
        run: python -u smoke_test.py
