name: CI — Smoke test

# Roda em todo PR para main e em todo push para main.
#
# Executa duas verificações: os testes unitários (tests/) e o smoke test, que
# cobre integridade dos dados, ImportError e renderização das páginas.
#
# O que este workflow NÃO faz: bloquear merge ou deploy. Bloquear merge depende
# de o check ser exigido nas regras de proteção da branch main, configuração
# externa a este arquivo. A implantação é gerida separadamente pelo trigger do
# Cloud Build, que publica no Cloud Run — fluxo independente deste workflow, sem
# precedência garantida entre os dois.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04  # fixado: ubuntu-latest migra para Ubuntu 26 em 19/10/2026
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'  # igual ao .python-version (produção)
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes unitários
        run: python -u -m unittest discover tests -v

      - name: Smoke test
        run: python -u smoke_test.py

      # Varredura de vulnerabilidades conhecidas nas dependências fixadas.
      # Por ora só avisa (não bloqueia): um aviso vermelho aqui pede decisão
      # registrada — atualizar a dependência ou aceitar o risco com justificativa.
      - name: Auditoria de dependências (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off
