name: Radar Legislativo — Atualização Automática

on:
  schedule:
    # Coletor principal: segunda-feira 09h de Brasilia (12h UTC).
    # Se houver snapshot com menos de 36 h (coleta manual recente),
    # o job agendado encerra sem coletar. O disparo manual sempre coleta.
    - cron: '0 12 * * 1'
  workflow_dispatch:        # Permite rodar manualmente pela interface do Actions

jobs:
  update-radar:
    runs-on: ubuntu-24.04  # fixado: ubuntu-latest migra para Ubuntu 26 em 19/10/2026
    timeout-minutes: 20
    permissions:
      contents: write       # Branch do snapshot, restrita a data/radar_legislativo.json
                            # pelo passo "Trava de escopo" abaixo (ADR 006).
      pull-requests: write  # A main exige PR (ruleset "protege-main", 23/10/2026):
                            # o snapshot entra por PR aberta e mesclada neste job.

    steps:
      # v5 e v6 rodam em Node24: some o aviso de deprecação do Node20
      - name: Checkout repositório
        uses: actions/checkout@v5

      - name: Configurar Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: pip install requests==2.33.1  # mesma versão do app (requirements.in)

      - name: Verificar se o notebook ja coletou esta semana
        id: frescor
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          r = json.load(open("data/radar_legislativo.json", encoding="utf-8"))
          ts = r.get("ultima_atualizacao")
          horas = (datetime.now() - datetime.fromisoformat(ts)).total_seconds() / 3600 if ts else 999
          fresco = horas < 36
          print(f"Ultimo snapshot ha {horas:.1f} h -> {'pular' if fresco else 'coletar'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fresco={'true' if fresco else 'false'}\n")
          PY

      # continue-on-error preserva o snapshot anterior e deixa as travas e o
      # commit rodarem; o último passo marca a execução como FALHA se o coletor
      # quebrou, para que a falha não passe por atualização bem-sucedida.
      - name: Executar radar legislativo
        id: coletor
        if: steps.frescor.outputs.fresco != 'true' || github.event_name == 'workflow_dispatch'
        run: python -u updater.py
        continue-on-error: true

      # ADR 006 — a coleta só vira commit se passar pelas duas travas:
      # 1) validação do snapshot (ids, estrutura, coleta não vazia);
      # 2) escopo: o robô só pode alterar data/radar_legislativo.json.
      - name: Validar snapshot
        if: steps.frescor.outputs.fresco != 'true' || github.event_name == 'workflow_dispatch'
        run: python -m lib.validacao --radar

      - name: Trava de escopo
        if: steps.frescor.outputs.fresco != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          PERMITIDO="data/radar_legislativo.json"
          ALTERADOS=$( (git diff --name-only; git ls-files --others --exclude-standard) | grep -v '__pycache__' | sort -u )
          FORA=$(echo "$ALTERADOS" | grep -v -x "$PERMITIDO" | grep -v '^$' || true)
          if [ -n "$FORA" ]; then
            echo "::error::O robô alterou arquivos fora do escopo do ADR 006:"
            echo "$FORA"
            exit 1
          fi
          echo "Escopo OK: ${ALTERADOS:-nenhuma alteração}"

      - name: Commitar snapshot se houve mudança
        if: steps.frescor.outputs.fresco != 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # git diff --quiet retorna 0 se NÃO há mudança, 1 se há.
          # O 'if' abaixo evita PR vazia quando o radar não achou nada novo.
          if git diff --quiet data/radar_legislativo.json; then
            echo "Nenhuma novidade detectada. Radar sem alterações."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A main é protegida e só aceita mudanças por PR (ruleset "protege-main").
          # O snapshot já passou pela validação e pela trava de escopo acima; a PR
          # é aberta e mesclada aqui mesmo, para não acumular PRs abertas (ADR 006).
          RAMO="radar/snapshot-$(date +'%Y-%m-%d')-${GITHUB_RUN_ID}"
          git checkout -b "$RAMO"
          git add data/radar_legislativo.json
          git commit -m "chore(radar): snapshot automático $(date +'%Y-%m-%d')"
          git push origin "$RAMO"

          gh pr create --base main --head "$RAMO" \
            --title "chore(radar): snapshot automático $(date +'%Y-%m-%d')" \
            --body "Snapshot gerado pela execução ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Validado (python -m lib.validacao --radar) e restrito a data/radar_legislativo.json pela trava de escopo (ADR 006). Mesclado automaticamente por este job."
          gh pr merge "$RAMO" --squash --delete-branch

          echo "Snapshot mesclado em main via PR."

      - name: Sinalizar falha do coletor
        if: steps.coletor.outcome == 'failure'
        run: |
          echo "::error::O coletor (updater.py) falhou. O snapshot anterior foi preservado, mas esta execução NÃO é uma atualização bem-sucedida. Ver o log do passo 'Executar radar legislativo'."
          exit 1

# ─────────────────────────────────────────────────────────────────────
# GOVERNANÇA — ver docs/adr/006-ingestao-automatizada-de-dados.md
#
# O radar é a única exceção à revisão humana prévia do ADR 005. A exceção
# é estreita: um arquivo, validado antes do commit, com proveniência
# gravada no próprio snapshot (bloco "proveniencia": executor, URL da
# execução, hash do conteúdo, estado e contagem por fonte).
#
# Desde 27/10/2026 o snapshot entra por PR aberta e mesclada pelo próprio
# job, porque a main passou a exigir PR (ruleset "protege-main", criado em
# 23/10/2026); o push direto de 26/10/2026 foi recusado. A validação continua
# acontecendo antes, dentro deste job.
#
# Por que a PR é mesclada no mesmo job, e não deixada para revisão: PRs
# abertas com o GITHUB_TOKEN não disparam outros workflows, então a
# validação precisa rodar aqui; e o fluxo de PR aguardando merge já foi
# tentado em jul-ago/2026 e acumulou PRs sem merge.
# O juízo humano acontece depois, quando uma proposição entra em
# normas.json: o radar alerta, o curador decide.
# ─────────────────────────────────────────────────────────────────────
